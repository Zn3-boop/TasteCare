[pytest]
asyncio_mode = auto
# Only collect test_*.py. Several handwritten scripts match pytest's default
# "*_test.py" pattern (e.g. _e2e_test.py, scripts/qloo_smoke_test.py) and they
# are run manually, not part of the suite.
python_files = test_*.py
markers =
    e2e: 端到端测试，依赖外部服务(LLM/Ollama/绘图/RAG)，需 -m e2e 显式激活
    real_api: 真实外部 API 冒烟(QLOO_API_KEY 存在时必跑；本机可 -m "not real_api" 跳过)
addopts = -m "not e2e"