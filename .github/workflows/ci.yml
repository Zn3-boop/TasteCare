name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r apps/server/requirements.txt -r apps/server/requirements-dev.txt
      - name: Run offline suite (mocks/unit; real_api excluded — needs a live key)
        run: |
          cd apps/server
          python -m pytest -q --tb=short -m "not real_api"

  # Optional live job: only runs when the repo has a QLOO_API_KEY secret.
  # Judges/self-hosted environments that export QLOO_API_KEY can also run the
  # full suite directly (`python -m pytest` runs real_api whenever the key is
  # present) — this job is the CI equivalent of that contract.
  backend-live:
    runs-on: ubuntu-latest
    if: secrets.QLOO_API_KEY != ''
    env:
      QLOO_API_KEY: ${{ secrets.QLOO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r apps/server/requirements.txt -r apps/server/requirements-dev.txt
      - name: Run live Qloo API tests (real_api marker)
        run: |
          cd apps/server
          python -m pytest -q --tb=short -m "real_api"

  frontend-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install & Build Web
        run: |
          cd apps/web
          npm install
          npm run build

  frontend-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install & Build Desktop
        run: |
          cd apps/desktop
          npm install
          npm run build