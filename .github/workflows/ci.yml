name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r apps/server/requirements.txt -r apps/server/requirements-dev.txt
      - name: Run offline suite (mocks/unit; real_api excluded — needs a live key)
        id: offline-suite
        run: |
          cd apps/server
          set +e
          python -m pytest -q --tb=long -m "not real_api" -p no:cacheprovider 2>&1 | tee /tmp/pytest-out.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            echo "::error::pytest exited with code $rc"
            {
              echo "## Backend pytest failed (exit $rc)"
              echo '```'
              tail -120 /tmp/pytest-out.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $rc
      - name: Upload pytest log on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-pytest-log
          path: /tmp/pytest-out.log
          if-no-files-found: ignore

  # Optional live job: the live Qloo tests run exactly when QLOO_API_KEY is
  # present. GitHub's workflow parser does NOT allow the `secrets` context in
  # ANY `if:` expression (neither job- nor step-level), so we never reference
  # it there: the secret is injected straight into the job-level env, and a
  # plain shell check in the run script decides whether to run the real_api
  # suite. Same contract as `python -m pytest` without markers (real_api runs
  # whenever the key is present), so judges/self-hosted runners exporting
  # QLOO_API_KEY get identical behavior.
  backend-live:
    runs-on: ubuntu-latest
    env:
      QLOO_API_KEY: ${{ secrets.QLOO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Run live Qloo API tests (real_api marker)
        run: |
          if [ -z "$QLOO_API_KEY" ]; then
            echo "::notice::QLOO_API_KEY not configured; skipping live Qloo API tests"
            exit 0
          fi
          pip install -r apps/server/requirements.txt -r apps/server/requirements-dev.txt
          cd apps/server
          python -m pytest -q --tb=short -m "real_api"

  frontend-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
          run_install: false
      - name: Install dependencies (pnpm workspace)
        run: pnpm install --frozen-lockfile
      - name: Build Web
        run: pnpm --filter web build